<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>智能工单分流 · 场景演示</title><style>
body{font-family:'PingFang SC',-apple-system,sans-serif;background:#f7f7f8;color:#16181d;margin:0;padding:32px}
.wrap{max-width:860px;margin:0 auto}h1{font-size:22px;margin:0 0 6px}
.sub{color:#6f7680;font-size:13px;margin-bottom:22px}
.flow{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;margin:18px 0}
.step{flex:1;min-width:150px;background:#fff;border:1px solid #e7e9ec;border-radius:10px;padding:14px}
.step b{display:block;font-size:13px;margin-bottom:5px}
.step span{font-size:12px;color:#6f7680}
.arrow{align-self:center;color:#1f3d99;font-size:20px}
.kpi{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.kpi div{flex:1;min-width:120px;background:#fff;border:1px solid #e7e9ec;border-radius:10px;padding:14px}
.kpi b{font-size:22px;display:block}.kpi span{font-size:12px;color:#6f7680}
.note{margin-top:22px;font-size:12px;color:#6f7680;border-left:3px solid #1f3d99;padding:4px 12px}
</style></head><body><div class="wrap">
<h1>智能工单分流</h1>
<div class="sub">场景演示 · 可在客户现场直接打开讲解(demo 示例,请替换为你的真实场景)</div>
<div class="flow">
  <div class="step"><b>① 工单进入</b><span>邮件 / 电话 / 门户多渠道汇聚</span></div>
  <div class="arrow">&rarr;</div>
  <div class="step"><b>② AI 识别</b><span>提取故障类型、影响范围、紧急度</span></div>
  <div class="arrow">&rarr;</div>
  <div class="step"><b>③ 自动路由</b><span>匹配技能组与值班人,附相似历史工单</span></div>
  <div class="arrow">&rarr;</div>
  <div class="step"><b>④ 闭环沉淀</b><span>解决方案自动入知识库</span></div>
</div>
<div class="kpi">
  <div><b>15min &rarr; 2min</b><span>平均首响时长</span></div>
  <div><b>&ge; 90%</b><span>分流准确率</span></div>
  <div><b>-30%</b><span>客服人力成本</span></div>
</div>
<div class="note">以上指标为演示占位值。正式客户汇报前请替换为你方产品的真实实测数据,并注明测试条件。</div>
</div></body></html>

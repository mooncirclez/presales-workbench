<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>售前工作台</title>
<style>
:root{--bg:#f7f7f8;--card:#ffffff;--ink:#16181d;--muted:#6f7680;--line:#e7e9ec;
--accent:#1f3d99;--accent-ink:#ffffff;--accent-soft:#eef1fa;--ok:#15803d;--ok-bg:#f0f7f2;
--warn:#a16207;--warn-bg:#fbf6ea;--bad:#b91c1c;--bad-bg:#fbf0f0;--chip:#f2f3f5;
--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#101114;--card:#17181c;--ink:#e6e7ea;
--muted:#8b919b;--line:#26282e;--accent:#93b0f5;--accent-ink:#101114;--accent-soft:#1d2333;
--ok:#4ade80;--ok-bg:#15251a;--warn:#e2b93b;--warn-bg:#272113;--bad:#f08080;--bad-bg:#2a1717;
--chip:#1f2126}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,
"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;overflow:hidden;
-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);
color:var(--ink);border-radius:8px;padding:6px 14px;transition:border-color .15s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.pri:hover{color:var(--accent-ink);opacity:.92}
button.sm{padding:3px 10px;font-size:12.5px;border-radius:6px}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);
border:1px solid var(--line);border-radius:8px;padding:7px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
/* ---- sidebar:极简无图标 ---- */
#side{width:198px;min-width:198px;background:var(--card);border-right:1px solid var(--line);
display:flex;flex-direction:column;padding:22px 0 16px}
.brand{padding:0 22px 20px}
.brand b{font-size:15.5px;letter-spacing:.5px;display:block}
.brand span{font-size:10px;color:var(--muted);letter-spacing:2.2px;text-transform:uppercase}
#side a{display:block;color:var(--muted);text-decoration:none;padding:8px 22px;font-size:13.5px;
border-left:2px solid transparent;transition:color .15s}
#side a.on{color:var(--ink);font-weight:600;border-left-color:var(--accent);background:var(--accent-soft)}
#side a:hover{color:var(--ink)}
#side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:14px 22px 0;
border-top:1px solid var(--line);line-height:1.7;margin-left:0;padding-bottom:12px}
#side .fline{font-size:11px;line-height:1.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side .flinks{display:flex;gap:10px;margin-top:6px}
/* 必须显式清掉 #side a 的导航样式(display:block + padding:8px 22px),
   否则三个链接各多出 44px 横向内边距,直接撑出侧栏 */
#side .flinks a{display:inline;padding:0;border-left:none;
  font-size:11px;color:var(--muted);cursor:pointer;text-decoration:none;white-space:nowrap}
#side .flinks a:hover{color:var(--accent)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.off{background:var(--warn)}.dot.bad{background:var(--bad)}
/* ---- main ---- */
#main{flex:1;overflow-y:auto;padding:30px 36px 70px}
.wrap{max-width:1060px;margin:0 auto}
h2{font-size:20px;font-weight:650;letter-spacing:.3px;margin-bottom:3px}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:20px}
.sec{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1.8px;
text-transform:uppercase;margin:28px 0 10px}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar .sp{flex:1}
.grid{display:grid;gap:12px}
.g6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card.click{cursor:pointer;transition:border-color .15s}
.card.click:hover{border-color:var(--accent)}
.card h3{font-size:14px;font-weight:650;margin-bottom:10px}
.stat b{font-size:24px;display:block;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat span{color:var(--muted);font-size:12px}
.stat .unit{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.tag{display:inline-block;font-size:11px;border-radius:5px;padding:1px 8px;font-weight:600;
border:1px solid transparent}
.tag.b{color:var(--accent);background:var(--accent-soft)}
.tag.g{color:var(--ok);background:var(--ok-bg)}
.tag.y{color:var(--warn);background:var(--warn-bg)}
.tag.r{color:var(--bad);background:var(--bad-bg)}
.tag.o{color:var(--muted);border-color:var(--line);background:transparent}
/* 中断/超时:橙底描边,和「完成」拉开距离,一眼看出没干成 */
.tag.w{color:var(--warn);background:var(--warn-bg);border-color:var(--warn)}
.tag.lnk{cursor:pointer;font:inherit;font-size:11px}
.tag.lnk:hover{color:var(--accent);border-color:var(--accent)}
.jmeta{white-space:nowrap;font-family:var(--mono);font-size:11px}
.ext{font:600 9.5px var(--mono);border:1px solid var(--line);border-radius:4px;
padding:1px 5px;color:var(--muted);letter-spacing:.5px;flex:none}
.prog{height:4px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;background:var(--accent)}
ul.plain{list-style:none}
ul.plain li{padding:7px 2px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;
font-size:13px}
ul.plain li:first-child{border-top:none}
a.f{color:var(--accent);text-decoration:none;cursor:pointer;word-break:break-all}
a.f:hover{text-decoration:underline}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:40px 10px;color:var(--muted);font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.8px;
padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
table.t tr.rowclick{cursor:pointer}
table.t tr.rowclick:hover td{background:var(--accent-soft)}
.kv{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:13px}
.kv div b{font-weight:600}
.kv div span{color:var(--muted);margin-right:6px;font-size:12px}
.hbar{display:flex;align-items:center;gap:10px;padding:5px 6px;font-size:12.5px;
border-radius:7px;transition:background .12s}
.hbar .lb{width:44px;color:var(--muted);flex:none}
.hbar .tr{flex:1;height:14px;background:var(--chip);border-radius:3px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--accent);opacity:.85;transition:opacity .12s}
.hbar .n{width:120px;text-align:right;color:var(--muted);flex:none}
.hbar.clickable{cursor:pointer}
.hbar.clickable:hover{background:var(--chip)}
.hbar.clickable:hover .tr i{opacity:1}
.hbar.dim{opacity:.5}
.hbar.on{background:var(--accent-soft)}
.hbar.on .lb{color:var(--accent);font-weight:700}
.hbar.on .tr i{opacity:1}
.hbar.on .n{color:var(--ink)}
/* 可下钻的项目行 */
li.prow{cursor:pointer;border-radius:6px;padding-left:6px;padding-right:4px}
li.prow:hover{background:var(--accent-soft)}
li.prow .chev{color:var(--muted);font-size:15px;flex:none}
li.prow:hover .chev{color:var(--accent)}
.risk{border-left:2px solid var(--warn);padding:6px 12px;margin:6px 0;font-size:13px;
background:var(--warn-bg);border-radius:0 6px 6px 0}
pre.org{font:12.5px/1.9 var(--mono);white-space:pre;overflow-x:auto;color:var(--ink);
background:var(--chip);border-radius:8px;padding:12px 14px}
/* 行动项:可勾选的任务列表 */
#pv li.task,.tlbody li.task{list-style:none;margin-left:-18px;display:flex;
gap:8px;align-items:flex-start}
#pv li.task input[type=checkbox],.tlbody li.task input[type=checkbox]{
width:15px;height:15px;margin:4px 0 0;flex:none;cursor:pointer;accent-color:var(--accent)}
#pv li.task.done>span,.tlbody li.task.done>span{text-decoration:line-through;color:var(--muted)}
/* 删除:统一红色垃圾桶图标按钮 */
button.del{border:none;background:none;padding:3px 5px;line-height:1;color:var(--muted);
border-radius:6px;font-size:14px;cursor:pointer;flex:none}
button.del:hover{background:var(--bad-bg);color:var(--bad)}
button.del svg{display:block;width:15px;height:15px;stroke:currentColor;
stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* 所见即所得编辑 */
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.richbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:8px 10px;
background:var(--card);border:1px solid var(--line);border-bottom:none;
border-radius:10px 10px 0 0;position:sticky;top:0;z-index:5}
.richbar .sp{flex:1}
.richsep{width:1px;height:18px;background:var(--line);margin:0 3px}
#pv.editing{border-radius:0 0 10px 10px;outline:none;min-height:60vh;
box-shadow:inset 0 0 0 2px var(--accent-soft)}
#pv.editing:focus{box-shadow:inset 0 0 0 2px var(--accent)}
#pv.editing td,#pv.editing th{min-width:48px}
#pv.editing td:hover,#pv.editing th:hover{background:var(--accent-soft)}
#pv.editing *:focus{outline:none}
/* 导出下拉 */
.expmenu{display:none;position:absolute;right:0;top:calc(100% + 4px);min-width:172px;
background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px;
box-shadow:0 6px 20px rgba(0,0,0,.14);z-index:40}
.expmenu.show{display:block}
.expmenu a{display:block;padding:7px 11px;font-size:13px;border-radius:6px;
cursor:pointer;color:var(--ink);white-space:nowrap}
.expmenu a:hover{background:var(--accent-soft);color:var(--accent)}
/* 模板列表:grid 三列固定 —— 单选永远在最左。
   注意 #modal label{display:block} / #modal input{width:100%} 特异性更高,必须用 #modal 前缀压过去 */
#modal label.tplrow,#modal label.tplopt{display:grid;
grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;
padding:9px 6px;border-top:1px solid var(--line);cursor:pointer;margin:0;
font-size:inherit;color:inherit;letter-spacing:normal}
#modal label.tplrow:hover,#modal label.tplopt:hover{background:var(--chip)}
#modal .tplgrp label.tplrow:first-of-type{border-top:none}
#modal label.tplrow input[type=radio],#modal label.tplopt input[type=radio]{
width:15px;height:15px;min-width:15px;margin:0;justify-self:center;flex:none}
#modal label.tplopt{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;padding:10px 11px}
#modal label.tplopt:hover{border-color:var(--accent)}
.tplinfo{min-width:0}
.tplname{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tplacts{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.tplacts a{display:inline-flex}
.tplgrp{margin-bottom:14px}
.tplgrp h4{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:650;
padding:0 6px 5px;border-bottom:1px solid var(--line)}
@media(max-width:640px){.tplacts button{padding:3px 7px}}
/* 任务产出链接 */
.arts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:7px;padding:6px 10px;
background:var(--accent-soft);border-radius:7px;font-size:12.5px;color:var(--muted)}
.arts a{display:inline-flex;align-items:center;gap:5px}
/* 技能市场 */
.mkrow{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;cursor:pointer;
border-bottom:1px solid var(--line)}
.mkrow:last-child{border-bottom:none}
.mkrow:hover{background:var(--chip)}
.mkrow.ins{opacity:.5;cursor:default}
.mkrow input{margin-top:3px;flex:none}
/* 知识编译状态条 */
.kbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 16px;margin-bottom:12px}
.kbar .sp{flex:1}
/* 纪要瀑布流 */
.tl{margin-top:4px}
.tlrow{display:flex;gap:14px;align-items:stretch}
.tlside{width:96px;flex:none;position:relative;padding-top:16px;text-align:right;
padding-right:14px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tlside .tldate{font-size:12.5px;color:var(--ink);font-weight:600}
.tlside .tlline{position:absolute;right:-1px;top:22px;bottom:-14px;border-right:1px solid var(--line)}
.tlside::after{content:"";position:absolute;right:-4.5px;top:20px;width:8px;height:8px;
border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.tlrow:last-child .tlline{display:none}
.tlcard{flex:1;min-width:0;margin-bottom:14px}
.tlbody{font-size:13.5px}
.tlbody h1{font-size:16px;margin:10px 0 6px}.tlbody h2{font-size:14.5px;margin:12px 0 5px;
color:var(--muted);letter-spacing:.3px}
.tlbody h3{font-size:13.5px;margin:9px 0 4px}
.tlbody ul,.tlbody ol{margin:5px 0 5px 20px}.tlbody li{margin:2px 0}
.tlbody p{margin:5px 0}
.tlbody table{border-collapse:collapse;margin:8px 0;font-size:12.5px;width:100%}
.tlbody th,.tlbody td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.tlbody th{background:var(--chip)}
.tlbody blockquote{border-left:2px solid var(--accent);padding:2px 10px;color:var(--muted);margin:6px 0}
.tlbody code{font-family:var(--mono);font-size:12px;background:var(--chip);border-radius:4px;padding:1px 4px}
.tlbody hr{border:none;border-top:1px solid var(--line);margin:10px 0}
@media(max-width:760px){.tlside{width:70px;padding-right:10px}.tlside .tldate{font-size:11.5px}}
/* 月历视图 */
.calhead{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--muted);
letter-spacing:.6px;margin-bottom:4px}
.calhead div{padding:2px 8px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cd{background:var(--card);min-height:96px;padding:5px 6px;cursor:pointer;transition:background .12s;
min-width:0}
.cd:hover{background:var(--accent-soft)}
.cd.out{background:var(--bg);cursor:default}
.cd .dn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:3px}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cd.today .dn{color:var(--accent);font-weight:700}
.ce{font-size:11px;line-height:1.55;padding:1px 5px;border-radius:4px;background:var(--chip);
margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
border-left:2px solid var(--accent)}
.ce:hover{background:var(--accent-soft)}
.ce.done{text-decoration:line-through;color:var(--muted);border-left-color:var(--line)}
.ce.more{border-left:none;color:var(--muted);background:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:5px 13px;font-size:12.5px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
@media(max-width:760px){.cd{min-height:64px}}
/* 知识库两栏 */
.kn{display:flex;gap:14px;align-items:flex-start}
.kn .tree{width:280px;flex:none;background:var(--card);border:1px solid var(--line);
border-radius:10px;padding:10px 8px;max-height:68vh;overflow-y:auto}
.tn{padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;gap:6px;
align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn:hover{background:var(--chip)}
.tn.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tn .chev{width:12px;color:var(--muted);flex:none;font-size:10px;text-align:center}
.kn .files{flex:1;min-width:0}
@media(max-width:900px){.kn{flex-direction:column}.kn .tree{width:100%;max-height:240px}}
/* editor */
#ed{width:100%;height:calc(100vh - 210px);min-height:320px;font-family:var(--mono);
font-size:13px;line-height:1.7;resize:vertical;white-space:pre;overflow:auto}
#pv{border:1px solid var(--line);border-radius:10px;background:var(--card);
padding:24px 28px;min-height:320px}
#pv h1{font-size:21px;margin:14px 0 8px}#pv h2{font-size:17px;margin:14px 0 8px}
#pv h3{font-size:15px;margin:12px 0 6px}
#pv p{margin:7px 0}#pv ul,#pv ol{margin:7px 0 7px 22px}
#pv code{font-family:var(--mono);font-size:12.5px;background:var(--chip);border-radius:5px;padding:1px 5px}
#pv pre{background:var(--chip);border-radius:8px;padding:12px;overflow-x:auto;margin:9px 0}
#pv pre code{background:none;padding:0}
#pv table{border-collapse:collapse;margin:10px 0;width:100%;font-size:13px}
#pv th,#pv td{border:1px solid var(--line);padding:5px 9px;text-align:left}
#pv th{background:var(--chip)}
#pv blockquote{border-left:2px solid var(--accent);padding:2px 12px;color:var(--muted);margin:8px 0}
#pv hr{border:none;border-top:1px solid var(--line);margin:14px 0}
/* modal & toast */
#mask{position:fixed;inset:0;background:rgba(15,17,20,.4);display:none;
align-items:center;justify-content:center;z-index:50}
#mask.show{display:flex}
#modal{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:24px;width:min(520px,92vw);max-height:88vh;overflow-y:auto}
#modal h3{margin-bottom:16px;font-size:15.5px}
#modal .row{margin-bottom:12px}
#modal .cols{display:flex;gap:10px}.cols .row{flex:1}
#modal label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;letter-spacing:.3px}
#modal input,#modal select,#modal textarea{width:100%}
#modal .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
#modal .btns .left{margin-right:auto}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
background:var(--ink);color:var(--bg);border-radius:8px;padding:9px 18px;font-size:13px;
opacity:0;transition:opacity .25s;z-index:60;max-width:80vw;pointer-events:none}
#toast.show{opacity:.95}
/* ---- 对话式 AI ---- */
.thread{min-height:130px;max-height:min(52vh,520px);overflow-y:auto;padding:4px 2px 2px;
display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;max-width:86%}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start;align-items:flex-start}
.bub{border-radius:12px;padding:9px 13px;font-size:13px;line-height:1.65;
word-break:break-word;overflow-wrap:anywhere}
.msg.me .bub{background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.msg.ai .bub{background:var(--chip);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.ai .bub.bad{border-color:var(--bad);background:var(--bad-bg,transparent)}
.bub>*:first-child{margin-top:0}.bub>*:last-child{margin-bottom:0}
.bub h1,.bub h2,.bub h3{font-size:14px;margin:10px 0 6px}
.bub pre{background:rgba(127,127,127,.12);border-radius:7px;padding:9px;
font-family:var(--mono);font-size:12px;white-space:pre-wrap;overflow-x:auto}
.bub table{border-collapse:collapse;font-size:12px;margin:6px 0;display:block;overflow-x:auto}
.bub td,.bub th{border:1px solid var(--line);padding:4px 8px}
.mmeta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:8px;
align-items:center;flex-wrap:wrap}
.chatin{display:flex;gap:8px;align-items:flex-end;margin-top:12px;
border-top:1px solid var(--line);padding-top:12px}
.chatin textarea{flex:1;resize:none;min-height:46px;max-height:180px;line-height:1.6}
.job{border-top:1px solid var(--line);padding:11px 2px}
.job:first-child{border-top:none}
.job pre{font-family:var(--mono);font-size:12px;background:var(--chip);border-radius:8px;
padding:10px;margin-top:8px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow-y:auto}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--accent);
border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;
vertical-align:-1px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:760px){body{flex-direction:column}
#side{width:100%;min-width:0;flex-direction:row;align-items:center;padding:10px 6px;overflow-x:auto}
.brand{padding:0 14px}#side a{white-space:nowrap;border-left:none;border-bottom:2px solid transparent}
#side a.on{border-left:none;border-bottom-color:var(--accent);background:none}
#side .foot{display:none}#main{padding:18px}}
</style>
</head>
<body>
<nav id="side">
  <div class="brand"><b>售前工作台</b><span>Presales Workbench</span></div>
  <a href="#/" data-r="dash">看板</a>
  <a href="#/customers" data-r="customers">客户</a>
  <a href="#/projects" data-r="projects">项目</a>
  <a href="#/collab" data-r="collab">协作</a>
  <a href="#/minutes" data-r="minutes">纪要</a>
  <a href="#/calendar" data-r="calendar">日历</a>
  <a href="#/scenarios" data-r="scenarios">场景库</a>
  <a href="#/skills" data-r="skills">技能</a>
  <a href="#/knowledge" data-r="knowledge">知识库</a>
  <a href="#/ai" data-r="ai">AI 任务 <span id="jbadge"></span></a>
  <div class="foot" id="sidefoot">加载中…</div>
</nav>
<main id="main"><div class="wrap" id="view"><div class="empty">加载中…</div></div></main>

<div id="mask"><div id="modal"></div></div>
<div id="toast"></div>

<script>
"use strict";
let S=null, pollTimer=null;

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const attr=v=>esc(v).replace(/`/g,"&#96;");
function toast(m,ms){const t=$("#toast");t.textContent=m;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),ms||2400);}
async function api(path,body){
  const opt=body?{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)}:{};
  const r=await fetch(path,opt);
  const j=await r.json().catch(()=>({error:"响应解析失败"}));
  if(!r.ok)throw new Error(j.error||("HTTP "+r.status));
  return j;}
async function refresh(){S=await api("/api/state");paintSide();}
function extChip(n){const m=n.match(/\.([a-z0-9]+)$/i);
  return `<span class="ext">${m?esc(m[1].toUpperCase()):"?"}</span>`;}
function openLocal(p){api("/api/open",{path:p}).then(()=>toast("已在本地打开"))
  .catch(e=>toast("打开失败:"+e.message));}
function edLink(p){return "#/edit/"+encodeURIComponent(p);}
const wan=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const fmtWan=v=>{const n=parseFloat(v);
  return (v===""||v==null||isNaN(n))?"—":n.toLocaleString("zh-CN")+" 万";};
const today=()=>new Date();
const daysAgo=d=>{const t=new Date();t.setDate(t.getDate()-d);return t;};
function meetDate(path){const m=(path.split("/").pop()||"").match(/^(\d{4}-\d{2}-\d{2})/);
  return m?new Date(m[1]+"T00:00:00"):null;}

/* ---------- modal ---------- */
function modal(h){$("#modal").innerHTML=h;$("#mask").classList.add("show");}
function closeModal(){$("#mask").classList.remove("show");}
$("#mask").addEventListener("click",e=>{if(e.target.id==="mask")closeModal();});

/* ---------- 新建 ---------- */
function mCustomer(){modal(`<h3>新建客户</h3>
  <div class="row"><label>客户简称(将作为目录名)</label><input id="m_name" placeholder="如:示例银行"></div>
  <p class="small muted">创建 customers/&lt;简称&gt;/:结构化档案 customer.json + 模板档案 profile.md。</p>
  <div class="btns"><button onclick="closeModal()">取消</button>
  <button class="pri" onclick="doCustomer()">创建</button></div>`);$("#m_name").focus();}
async function doCustomer(){try{
  const r=await api("/api/customer",{name:$("#m_name").value});
  closeModal();location.hash="#/customer/"+encodeURIComponent(r.id);
  toast("客户已创建");refresh().then(route).catch(()=>{});}catch(e){toast(e.message);}}

function mProject(pre){const opts=(S.customers||[]).map(c=>
    `<option ${c.id===pre?"selected":""}>${esc(c.id)}</option>`).join("");
  if(!opts){toast("请先创建客户");return mCustomer();}
  modal(`<h3>新建项目 / 商机</h3>
  <div class="row"><label>客户</label><select id="m_cust">${opts}</select></div>
  <div class="row"><label>项目名</label><input id="m_pname" placeholder="如:智能客服平台一期"></div>
  <div class="cols"><div class="row"><label>阶段</label><select id="m_stage">${S.config.stages.map(s=>
    `<option>${esc(s)}</option>`).join("")}</select></div>
  <div class="row"><label>预算(万元)</label><input id="m_budget" type="number" min="0" placeholder="如 120"></div></div>
  <div class="btns"><button onclick="closeModal()">取消</button>
  <button class="pri" onclick="doProject()">创建</button></div>`);$("#m_pname").focus();}
async function doProject(){try{
  const r=await api("/api/project",{customer:$("#m_cust").value,
    name:$("#m_pname").value,stage:$("#m_stage").value});
  const b=$("#m_budget").value;
  if(b!==""){const meta={name:$("#m_pname").value,customer:$("#m_cust").value,
    stage:$("#m_stage").value,created:new Date().toISOString().slice(0,19).replace("T"," "),
    budget_wan:parseFloat(b),contract_wan:"",sign_date:""};
    await api("/api/file",{path:"projects/"+r.dir+"/project.json",
      content:JSON.stringify(meta,null,2)});}
  closeModal();location.hash="#/project/"+encodeURIComponent(r.dir);
  toast("项目已创建");refresh().then(route).catch(()=>{});}catch(e){toast(e.message);}}

/* ---------- 客户结构化档案 ---------- */
const ROLES=["决策人","技术把关","使用方","内线","其他"];
const LEVELS=["战略","重点","一般"];
function custMeta(id){const c=S.customers.find(x=>x.id===id);
  const m=c&&c.meta?JSON.parse(JSON.stringify(c.meta)):{};
  m.contacts=m.contacts||[];m.kpis=m.kpis||[];return m;}
async function saveCustMeta(id,meta){meta.updated=new Date().toISOString().slice(0,10);
  await api("/api/file",{path:"customers/"+id+"/customer.json",
    content:JSON.stringify(meta,null,2)});
  await refresh();route();}

function mEditCust(id){const m=custMeta(id);
  modal(`<h3>编辑客户信息 · ${esc(id)}</h3>
  <div class="row"><label>客户全称</label><input id="c_full" value="${attr(m.full_name||"")}"></div>
  <div class="cols">
    <div class="row"><label>行业</label><input id="c_ind" value="${attr(m.industry||"")}"></div>
    <div class="row"><label>客户等级</label><select id="c_lv">${LEVELS.map(l=>
      `<option ${l===(m.level||"重点")?"selected":""}>${l}</option>`).join("")}</select></div>
  </div>
  <div class="row"><label>对接销售</label><input id="c_sales" value="${attr(m.sales||"")}"
    placeholder="负责该客户的销售姓名(我方,不脱敏)"></div>
  <div class="row"><label>客户简称 / 别名</label><input id="c_alias" placeholder="示例行,示例银行,SYB">
    <div class="small muted" style="margin-top:4px">写进映射表当替换词,<b>不存进档案、不回显</b>。
      纪要里写简称时才认得出来 —— 不填的话简称会明文落盘。</div></div>
  <div class="btns"><button onclick="closeModal()">取消</button>
  <button class="pri" onclick="doEditCust('${attr(id)}')">保存</button></div>`);}
async function doEditCust(id){try{const m=custMeta(id);
  m.full_name=$("#c_full").value;m.industry=$("#c_ind").value;m.level=$("#c_lv").value;
  m.sales=$("#c_sales").value;
  const al=$("#c_alias").value.trim();if(al)m.aliases=al;   // 只写通道,后端入表后即丢弃
  closeModal();await saveCustMeta(id,m);
  toast(al?"已保存,别名已入映射表":"已保存");}catch(e){toast(e.message);}}

function mContact(id,idx){const m=custMeta(id);
  const c=idx>=0?m.contacts[idx]:{name:"",title:"",role:"其他",phone:"",wechat:"",note:""};
  modal(`<h3>${idx>=0?"编辑":"添加"}联系人 · ${esc(id)}</h3>
  <div class="cols">
    <div class="row"><label>姓名</label><input id="p_name" value="${attr(c.name)}"></div>
    <div class="row"><label>部门 / 职务</label><input id="p_title" value="${attr(c.title)}"></div>
  </div>
  <div class="cols">
    <div class="row"><label>角色</label><select id="p_role">${ROLES.map(r=>
      `<option ${r===c.role?"selected":""}>${r}</option>`).join("")}</select></div>
  </div>
  <div class="row"><label>备注(态度/影响力)</label><input id="p_note" value="${attr(c.note||"")}"></div>
  <div class="btns">${idx>=0?`<button class="danger left" onclick="delContact('${attr(id)}',${idx})">删除</button>`:""}
  <button onclick="closeModal()">取消</button>
  <button class="pri" onclick="doContact('${attr(id)}',${idx})">保存</button></div>`);
  $("#p_name").focus();}
async function doContact(id,idx){try{const m=custMeta(id);
  const c={name:$("#p_name").value.trim(),title:$("#p_title").value,role:$("#p_role").value,
    note:$("#p_note").value};
  if(!c.name)return toast("姓名不能为空");
  if(idx>=0)m.contacts[idx]=c;else m.contacts.push(c);
  closeModal();await saveCustMeta(id,m);toast("已保存");}catch(e){toast(e.message);}}
async function delContact(id,idx){try{const m=custMeta(id);m.contacts.splice(idx,1);
  closeModal();await saveCustMeta(id,m);toast("已删除");}catch(e){toast(e.message);}}

function mKpi(id,idx){const m=custMeta(id);
  const k=idx>=0?m.kpis[idx]:{name:"",target:"",current:"",note:""};
  modal(`<h3>${idx>=0?"编辑":"添加"}客户 KPI · ${esc(id)}</h3>
  <div class="row"><label>指标名称(客户被考核什么)</label><input id="k_name" value="${attr(k.name)}"
    placeholder="如:线上客服人力成本下降 30%"></div>
  <div class="cols">
    <div class="row"><label>目标值</label><input id="k_target" value="${attr(k.target||"")}"></div>
    <div class="row"><label>现状</label><input id="k_cur" value="${attr(k.current||"")}"></div>
  </div>
  <div class="row"><label>与我方方案的关联 / 备注</label><input id="k_note" value="${attr(k.note||"")}"></div>
  <div class="btns">${idx>=0?`<button class="danger left" onclick="delKpi('${attr(id)}',${idx})">删除</button>`:""}
  <button onclick="closeModal()">取消</button>
  <button class="pri" onclick="doKpi('${attr(id)}',${idx})">保存</button></div>`);$("#k_name").focus();}
async function doKpi(id,idx){try{const m=custMeta(id);
  const k={name:$("#k_name").value.trim(),target:$("#k_target").value,
    current:$("#k_cur").value,note:$("#k_note").value};
  if(!k.name)return toast("指标不能为空");
  if(idx>=0)m.kpis[idx]=k;else m.kpis.push(k);
  closeModal();await saveCustMeta(id,m);toast("已保存");}catch(e){toast(e.message);}}
async function delKpi(id,idx){try{const m=custMeta(id);m.kpis.splice(idx,1);
  closeModal();await saveCustMeta(id,m);toast("已删除");}catch(e){toast(e.message);}}

function mOrg(id){const m=custMeta(id);
  modal(`<h3>组织架构 · ${esc(id)}</h3>
  <div class="row"><label>用缩进表示层级(每行一个节点:部门 / 姓名 职务)</label>
  <textarea id="o_txt" rows="10" style="font-family:var(--mono);font-size:12.5px"
  placeholder="集团\n  信息技术部\n    王总 CIO(决策人)\n    李经理 系统科\n  采购部">${esc(m.org||"")}</textarea></div>
  <div class="btns"><button onclick="closeModal()">取消</button>
  <button class="pri" onclick="doOrg('${attr(id)}')">保存</button></div>`);}
async function doOrg(id){try{const m=custMeta(id);m.org=$("#o_txt").value;
  closeModal();await saveCustMeta(id,m);toast("已保存");}catch(e){toast(e.message);}}

/* ---------- AI ---------- */
function mAI(title,prompt){if(!S.claude.available){
    return modal(`<h3>AI 功能不可用</h3><p class="small">本机未找到 <code>claude</code> CLI。
    请安装 Claude Code 并运行 <code>claude login</code>。</p>
    <div class="btns"><button class="pri" onclick="closeModal()">知道了</button></div>`);}
  modal(`<h3>确认调用 AI</h3>
  <div class="row"><label>任务</label><div><b>${esc(title)}</b></div></div>
  <div class="row"><label>将发送给本机 claude 的指令(可修改)</label>
  <textarea id="m_prompt" rows="7">${esc(prompt)}</textarea></div>
  <p class="small muted">将在后台运行一次真实 Claude 会话(你的账号与额度),产出直接写入工作台文件。</p>
  <div class="btns"><button onclick="closeModal()">取消</button>
  <button class="pri" onclick="doAI('${attr(title)}')">运行</button></div>`);}
async function doAI(title){try{
  await api("/api/ai",{title:title,prompt:$("#m_prompt").value});
  closeModal();toast("AI 任务已提交");startPoll();
  if(location.hash==="#/ai")route();}catch(e){toast(e.message);}}

const JF={cat:"",status:"",q:"",since:"",archived:0};
function jobQuery(){const p=new URLSearchParams();
  if(JF.cat)p.set("cat",JF.cat); if(JF.status)p.set("status",JF.status);
  if(JF.q)p.set("q",JF.q); if(JF.since)p.set("since",JF.since);
  if(JF.archived)p.set("archived","1");
  const s=p.toString();return "/api/jobs"+(s?"?"+s:"");}
async function pollJobs(){try{
    const j=await api(jobQuery());S._jobs=j.jobs;S._jobmeta=j;
    const running=j.jobs.filter(x=>x.status==="running"||x.status==="queued").length;
    $("#jbadge").innerHTML=running?`<span class="tag y">${running}</span>`:"";
    if(location.hash==="#/ai"){paintJobFilter();paintJobs();
      const r=await api("/api/chat?id="+encodeURIComponent(CHAT.id||""));
      CHAT.turns=r.turns||[];CHAT.chats=r.chats||[];
      if(CHAT.pending&&CHAT.turns.some(t=>t.prompt===CHAT.pending.prompt))CHAT.pending=null;
      paintChat();}
    if(!running){clearInterval(pollTimer);pollTimer=null;}
  }catch(e){}}
function jfSet(k,v){JF[k]=v;if(k==="archived")JF.cat="";pollJobs();}

/* 任务归档/删除。归档只是收起来(仍留在它所属的对话里);删除是真删记录 ——
   回收站存的是文件,任务是 .workbench/jobs.jsonl 里的记录,进不了回收站,所以要问一次。 */
async function jobOp(op,id){try{
  await api("/api/job",{op:op,id:id});
  pollJobs();loadChat();
  toast(op==="archive"?"已归档 —— 在筛选栏「已归档」里可以找回":"已移回任务列表");
}catch(e){toast(e.message,4500);}}

function delJob(id){
  const j=(S._jobs||[]).find(x=>x.id===id)||{};
  modal(`<h3>删除任务记录</h3>
  <p class="small"><b>${esc(j.title||id)}</b></p>
  <p class="small muted">任务记录不是文件,<b>不会进回收站,删了找不回来</b>。
    只是想让列表清爽的话,用「归档」更合适。</p>
  <p class="small muted">已生成的产出文件不受影响,仍在原目录。</p>
  <div class="btns"><button onclick="closeModal()">取消</button>
  <button class="pri" onclick="doDelJob('${attr(id)}')">确认删除</button></div>`);}

async function doDelJob(id){try{
  await api("/api/job",{op:"delete",id:id});
  closeModal();pollJobs();loadChat();toast("任务记录已删除");
}catch(e){toast(e.message,4500);}}

function clearArchivedJobs(){
  const n=(S._jobmeta||{}).archived_total||0;
  modal(`<h3>清空已归档任务</h3>
  <p class="small">将永久删除 <b>${n}</b> 条已归档任务记录,不进回收站、无法恢复。</p>
  <p class="small muted">已生成的产出文件不受影响。</p>
  <div class="btns"><button onclick="closeModal()">取消</button>
  <button class="pri" onclick="doClearArchived()">确认清空</button></div>`);}

async function doClearArchived(){try{
  const r=await api("/api/job",{op:"clear-archived"});
  closeModal();JF.archived=0;pollJobs();loadChat();
  toast(`已清空 ${r.affected} 条归档任务`);
}catch(e){toast(e.message,4500);}}

function delChat(){
  if(!CHAT.id||!CHAT.turns.length)return toast("当前没有可删除的对话");
  modal(`<h3>删除整条对话</h3>
  <p class="small">将删除这条对话的 <b>${CHAT.turns.length}</b> 轮任务记录,不进回收站、无法恢复。</p>
  <p class="small muted">对话期间生成的文件不受影响,仍在原目录。</p>
  <div class="btns"><button onclick="closeModal()">取消</button>
  <button class="pri" onclick="doDelChat()">确认删除</button></div>`);}

async function doDelChat(){try{
  await api("/api/job",{op:"delete-chat",chat_id:CHAT.id});
  closeModal();CHAT.id="";CHAT.turns=[];CHAT.pending=null;
  localStorage.removeItem("wb_chat");
  await loadChat();pollJobs();route();toast("对话已删除");
}catch(e){toast(e.message,4500);}}
function paintJobFilter(){
  const el=$("#jobfilter");if(!el)return;
  const m=S._jobmeta||{};const cats=m.categories||{};const cnt=m.counts||{};
  el.innerHTML=`
  <div class="bar" style="margin-bottom:8px">
    <input id="jf_q" placeholder="搜索任务标题 / 输出内容…" style="flex:1;min-width:180px"
      value="${attr(JF.q)}" onchange="jfSet('q',this.value)"
      onkeydown="if(event.key==='Enter')jfSet('q',this.value)">
    <select onchange="jfSet('status',this.value)">
      <option value="">全部状态</option>
      ${Object.entries(m.states||{done:"完成",failed:"失败"}).concat([["running","运行中"]])
        .map(([v,t])=>`<option value="${v}" ${JF.status===v?"selected":""}>${t}</option>`).join("")}
    </select>
    <input type="date" value="${attr(JF.since)}" title="只看该日期之后"
      onchange="jfSet('since',this.value)" style="width:140px">
    ${(JF.q||JF.cat||JF.status||JF.since)?
      `<button class="sm" onclick="JF.cat='';JF.status='';JF.q='';JF.since='';pollJobs()">清除</button>`:""}
    <span class="sp"></span>
    ${m.archived_total?`<button class="sm ${JF.archived?"on":""}"
      onclick="jfSet('archived',${JF.archived?'0':'1'})">${JF.archived?"← 回到任务列表":`已归档 ${m.archived_total}`}</button>`:""}
    ${JF.archived&&m.archived_total?`<button class="sm" onclick="clearArchivedJobs()"
      title="永久删除全部已归档任务">清空已归档</button>`:""}
    <span class="small muted">${m.matched===m.total?`共 ${m.total} 条`:`${m.matched} / ${m.total} 条`}</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">
    <button class="sm ${JF.cat?"":"pri"}" onclick="jfSet('cat','')">全部</button>
    ${Object.entries(cats).filter(([k])=>cnt[k]).map(([k,label])=>
      `<button class="sm ${JF.cat===k?"pri":""}" onclick="jfSet('cat','${attr(k)}')">${esc(label)} ${cnt[k]}</button>`).join("")}
  </div>`;}
function startPoll(){if(!pollTimer)pollTimer=setInterval(pollJobs,3000);pollJobs();}

/* ---------- sidebar ---------- */
function paintSide(){
  const c=S.claude,mcp=S.mcp||[];
  const mcpTxt=mcp.map(m=>`<span class="dot ${m.status==="live"?"ok":"off"}"></span>${esc(m.id)} ${m.status==="live"?"在线":"未启动"}`).join("<br>")||"无 MCP";
  const live=mcp.filter(m=>m.status==="live").length;
  const mcpShort=mcp.length?`MCP ${live}/${mcp.length}`:"无 MCP";
  $("#sidefoot").innerHTML=
    // 页脚压到三行:状态、版本、次级入口。侧栏是导航区,不该被状态信息占掉三分之一
    `<div class="fline"><span class="dot ${c.available?"ok":"bad"}"></span>claude ${
      c.available?"可用":"未登录"} <span class="muted">· ${mcpShort}</span></div>`+
    `<div class="fline muted">${esc(S.pack.id)}@${esc(S.pack.version)}${
      S.config.version?` · v${esc(S.config.version)}`:""}</div>`+
    `<div class="flinks">`+
      `<a onclick="goInbox()">收件箱${S.inbox.length?`·${S.inbox.length}`:""}</a>`+
      `<a href="#/trash">回收站</a>`+
      `<a href="#/mask">映射表</a>`+
    `</div>`;

function projHash(dir){
  // 项目可能已归档:归档的跳归档详情,在营的跳项目页
  if(S.projects.some(p=>p.dir===dir))return "#/project/"+encodeURIComponent(dir);
  if((S.archived||[]).some(a=>a.dir===dir))return "#/archived/"+encodeURIComponent(dir);
  return "#/projects";}
function riskHtml(r){
  const label=esc(r.id);
  const link=r.kind==="project"
    ?`<a class="f" href="${projHash(r.id)}">${label}</a>`
    :`<a class="f" href="#/customer/${encodeURIComponent(r.id)}">${label}</a>`;
  // 后端只给纯文本结论,前端只做强调与跳转
  const msg=esc(r.msg).replace(/(缺毛利测算|缺合同评审|未登记合同金额|尚无任何交付物|无任何拜访纪要|已 \d+ 天未跟进|受阻|已过期未完成)/,"<b>$1</b>");
  return `<div class="risk">${link} ${msg}</div>`;}
/* --- 看板 To Do --- */
async function doneTodo(kind,id,box,path,idx){
  if(!box.checked)return;
  box.disabled=true;
  try{
    if(kind==="collab")await api("/api/collab",{op:"update",item:{id:id,status:"已完成"}});
    else if(kind==="meeting")await api("/api/meeting-todo",{path:path,index:idx,checked:true});
    else await api("/api/todo",{op:"update",todo:{id:id,done:true}});
    await refresh();route();
    toast(kind==="meeting"?"已在纪要中勾选完成":"已完成");
  }catch(e){box.checked=false;box.disabled=false;toast(e.message);}}
/* 把纪要行动项转成协作动作(不自动创建 —— 协作需要指定对哪条线、对方是谁) */
function todoToCollab(title,project,owner){
  mCollab(-1,project);
  setTimeout(()=>{
    const t=$("#cb_title");if(t)t.value=title.replace(/@\S+/,"").trim();
    const p=$("#cb_peer");if(p&&owner&&!/^我$|^me$/i.test(owner))p.value=owner;
    const d=$("#cb_due");
    const m=title.match(/(\d{4}-\d{1,2}-\d{1,2})|(?<!\d)(\d{1,2}-\d{1,2})(?!\d)/);
    if(d&&m){const s=m[0].split("-");
      d.value=s.length===3?`${s[0]}-${String(+s[1]).padStart(2,"0")}-${String(+s[2]).padStart(2,"0")}`
        :`${new Date().getFullYear()}-${String(+s[0]).padStart(2,"0")}-${String(+s[1]).padStart(2,"0")}`;}
  },120);}

  done.forEach(t=>{const d=(t.done_at||"").slice(0,10)||(t.kind==="meeting"?"纪要中已勾选":"未记录时间");
    (groups[d]=groups[d]||[]).push(t);});
  const body=Object.keys(groups).sort((a,b)=>{

  modal(`<h3>已完成历史 <span class="tag g">${done.length}</span></h3>

async function undoTodo(kind,id,path,idx){try{
  if(kind==="collab")await api("/api/collab",{op:"update",item:{id:id,status:"进行中"}});
  else if(kind==="meeting")await api("/api/meeting-todo",{path:path,index:idx,checked:false});

function todoRow(t){
  const today=new Date().toISOString().slice(0,10);

  const dueTxt=t.due?`<span class="small mono ${overdue?"":"muted"}"
    ${overdue?"style='color:var(--bad)'":""}>${esc(t.due)}</span>`:"";
  if(t.kind==="collab"){
    return `<li><input type="checkbox" onchange="doneTodo('collab','${attr(t.id)}',this)"
      title="勾选 = 协作动作标记已完成">

    <a class="f small" href="${projHash(t.project)}">${esc((t.project||"").replace(/^.*?-/,""))}</a>

    return `<li><input type="checkbox" title="勾选 = 在纪要里标记该行动项完成"
      onchange="doneTodo('meeting','${attr(t.id)}',this,'${attr(t.path)}',${t.task_index})">

    ${t.project?`<a class="f small" href="${projHash(t.project)}">${esc(projLabel(t.project))}</a>`:""}

  return `<li><input type="checkbox" onchange="doneTodo('custom','${attr(t.id)}',this)">
    <span class="tag o">待办</span>

function uploadSlot(dir,slot,label){
  const inp=document.createElement("input");
  inp.type="file";inp.multiple=true;inp.style.display="none";
  document.body.appendChild(inp);
  inp.onchange=async()=>{
    const fs=[...inp.files];inp.remove();
    if(!fs.length)return;
    try{
      toast(`上传中(${fs.length} 个)…`,4000);
      const files=[];
      for(const f of fs){
        if(f.size>60*1024*1024){toast(`${f.name} 超过 60MB,已跳过`,4000);continue;}
        const b64=await new Promise((res,rej)=>{const r=new FileReader();
          r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f);});
        files.push({filename:f.name,content_b64:b64});}
      if(!files.length)return;
      const r=await api("/api/slot-upload",{project:dir,slot:slot,files:files});
      await refresh();route();
      toast(`已放入「${label}」:${r.paths.map(p=>p.split("/").pop()).join("、")}`,4500);
    }catch(e){toast(e.message,5000);}};
  inp.click();}

const KN={sel:"my local knowledge",open:{"my local knowledge":true}};
function knBuild(){
  const root={},filesByDir={};
  S.knowledge.forEach(f=>{
    if(f.dir==="reports")return;
    (filesByDir[f.dir]=filesByDir[f.dir]||[]).push(f);
    const parts=(f.dir||"").split("/").filter(Boolean);
    let node=root,path="";
    parts.forEach(p=>{path=path?path+"/"+p:p;
      node[p]=node[p]||{__path:path,__ch:{}};node=node[p].__ch;});});
  return {root,filesByDir};}
function knNode(node,depth){
  return Object.keys(node).sort().map(name=>{
    const n=node[name],open=!!KN.open[n.__path],sel=KN.sel===n.__path;
    const hasCh=Object.keys(n.__ch).length>0;
    return `<div class="tn ${sel?"sel":""}" data-p="${esc(n.__path)}"
      style="padding-left:${6+depth*14}px">
      <span class="chev">${hasCh?(open?"▾":"▸"):"·"}</span>
      <span style="overflow:hidden;text-overflow:ellipsis">${esc(name)}</span></div>`
      +(open&&hasCh?knNode(n.__ch,depth+1):"");}).join("");}
function knClick(ev){const t=ev.target.closest(".tn");if(!t)return;
  const p=t.dataset.p;
  if(KN.sel===p)KN.open[p]=!KN.open[p];      // 已选中再点 = 折叠/展开
  else{KN.sel=p;KN.open[p]=true;}            // 选中并展开
  route();}
function knFileRow(f,showDir){
  return `<li>${extChip(f.name)} ${f.editable?
    `<a class="f" href="${edLink(f.path)}">${esc(f.name)}</a>`:
    `<a class="f" onclick="openLocal('${attr(f.path)}')">${esc(f.name)}</a>`}

    ${delBtn(`mDelete('${attr(f.path)}','knowledge','${attr(f.name)}','该文件移入回收站。若它已被提取过,提取产物需重新「提取新增文档」后才会同步。')`)}</li>`;}

/* ---------- 日历(月视图 + 列表) ---------- */
const CALV={ym:new Date().toISOString().slice(0,7),mode:"month"};
function calNav(delta){
  if(delta===0){CALV.ym=new Date().toISOString().slice(0,7);}
  else{const [y,m]=CALV.ym.split("-").map(Number);
    const d=new Date(y,m-1+delta,1);
    CALV.ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
  route();}
function calMode(m){CALV.mode=m;route();}
function calGrid(){
  const [y,m]=CALV.ym.split("-").map(Number);
  const offset=(new Date(y,m-1,1).getDay()+6)%7;   // 周一为第一列
  const dim=new Date(y,m,0).getDate();
  const todayS=new Date().toISOString().slice(0,10);
  const byDate={};
  (S.events||[]).forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  let cells="";
  const total=Math.ceil((offset+dim)/7)*7;
  for(let i=0;i<total;i++){
    const d=i-offset+1;
    if(d<1||d>dim){cells+=`<div class="cd out"></div>`;continue;}
    const ds=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const evs=(byDate[ds]||[]).slice().sort((a,b)=>(a.time||"")<(b.time||"")?-1:1);
    const chips=evs.slice(0,3).map(e=>{const gi=(S.events||[]).findIndex(x=>x.id===e.id);
      return `<div class="ce ${e.done?"done":""}" title="${attr((e.time||"")+" "+e.title)}"
        onclick="event.stopPropagation();mEvent(${gi})">${esc(e.time||"")} ${esc(e.title)}</div>`;}).join("");
    const more=evs.length>3?`<div class="ce more">+${evs.length-3} 更多(点格子)</div>`:"";
    cells+=`<div class="cd ${ds===todayS?"today":""}" onclick="mEvent(-1,'${ds}')"
      title="点击在 ${ds} 新建日程"><div class="dn">${d}</div>${chips}${more}</div>`;}
  return `<div class="calhead">${["一","二","三","四","五","六","日"].map(w=>
    `<div>周${w}</div>`).join("")}</div><div class="calgrid">${cells}</div>`;}
function calList(){
  const evs=(S.events||[]).slice().sort((a,b)=>
    (a.date+(a.time||""))<(b.date+(b.time||""))?-1:1);
  const todayS=new Date().toISOString().slice(0,10);
  const groups={};
  evs.forEach(e=>{const k=e.date<todayS?(e.done?"已过":"已过期未完成"):e.date;
    (groups[k]=groups[k]||[]).push(e);});
  const lab=d=>{if(d==="已过"||d==="已过期未完成")return d;
    const diff=Math.round((new Date(d)-new Date(todayS))/864e5);
    return d+(diff===0?" · 今天":diff===1?" · 明天":diff>1&&diff<7?` · ${diff} 天后`:"");};
  return Object.keys(groups).sort((a,b)=>{
    const w=k=>k==="已过期未完成"?"0":k==="已过"?"z":k;return w(a)<w(b)?-1:1;})
    .map(g=>`<div class="sec" style="margin-top:16px">${esc(lab(g))}</div>
    <div class="card" style="padding:6px 14px"><table class="t">${groups[g].map(e=>{
      const i=(S.events||[]).findIndex(x=>x.id===e.id);
      return `<tr>
      <td style="width:26px"><input type="checkbox" ${e.done?"checked":""}
        onchange="doneEvent('${attr(e.id)}',this.checked)"></td>
      <td class="mono" style="width:60px">${esc(e.time||"")}</td>
      <td><b ${e.done?"style='text-decoration:line-through;color:var(--muted)'":""}>${esc(e.title)}</b>
        ${e.place?`<span class="small muted"> · ${esc(e.place)}</span>`:""}
        ${e.customer?`<span class="tag o" style="margin-left:6px">${esc(e.customer)}</span>`:""}</td>
      <td class="small muted" style="width:90px">提前 ${esc(e.remind_min||30)} 分钟</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="sm" onclick="mEvent(${i})">编辑</button></td></tr>`;}).join("")}</table></div>`).join("");}
function vCalendar(){
  const [y,m]=CALV.ym.split("-").map(Number);
  const isMonth=CALV.mode==="month";
  const body=isMonth?calGrid():
    (calList()||`<div class="empty">暂无日程 — 点月历空格子,或用一句话让 AI 建</div>`);
  return `<h2>日历</h2><div class="sub">日程与提醒 — 到点由工作台服务弹 macOS 系统通知(服务需在运行)</div>
  <div class="bar">
    <button class="pri" onclick="mEvent(-1)">新建日程</button>
    <input id="quickEv" placeholder='快速创建:一句话,如 "下周三下午3点去示例科技做POC汇报,提前1小时提醒"'
      style="flex:1;min-width:260px" onkeydown="if(event.key==='Enter')quickEvent()">

  </div>
  <div class="bar">
    <span class="seg"><button class="${isMonth?"on":""}" onclick="calMode('month')">月视图</button><button
      class="${isMonth?"":"on"}" onclick="calMode('list')">列表</button></span>
    ${isMonth?`<span class="sp"></span>
      <button class="sm" onclick="calNav(-1)">← 上月</button>
      <b style="min-width:110px;text-align:center">${y} 年 ${m} 月</b>

async function doImportSkill(){
  const name=$("#si_name").value.trim();
  if(!/^[a-z0-9][a-z0-9-]{1,40}$/.test(name))return toast("技能标识不合法");
  const one=$("#si_file").files[0];const dirFiles=[...$("#si_dir").files];
  const rd=f=>new Promise((res,rej)=>{const r=new FileReader();
    r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f);});
  try{
    let payload={name:name};
    if(one&&/\.zip$/i.test(one.name)){payload.zip_b64=await rd(one);}
    else if(one){payload.files=[{path:one.name,content_b64:await rd(one)}];}
    else if(dirFiles.length){
      toast("读取文件中…");
      payload.files=[];
      for(const f of dirFiles.slice(0,300)){
        if(f.size>10*1024*1024)continue;
        payload.files.push({path:f.webkitRelativePath||f.name,content_b64:await rd(f)});}
    }else return toast("先选择 zip / md 文件或文件夹");
    toast("导入中…");
    await api("/api/skill-import",payload);
    closeModal();await refresh();route();toast("技能已导入并生效,建议点「编辑」审阅一遍");
  }catch(e){toast(e.message,5000);}}

/* 任务状态标签。blocked = 跑完了但没干成(被权限拦下 / 撞上限),
   以前这类一律记成「完成」,列表上看着没事、点开才发现它在求授权。 */
function jobChip(j){
  const m={done:["g","完成"],blocked:["w","中断"],timeout:["w","超时"],failed:["r","失败"]}[j.status];
  if(m)return `<span class="tag ${m[0]}"${j.stop_detail?` title="${attr(j.stop_detail)}"`:""}>${m[1]}</span>`;
  return `<span class="tag y"><span class="spin"></span>${j.status==="queued"?"排队":"运行中"}</span>`;}

function fmtDur(ms){
  if(!ms)return "";
  if(ms<1000)return ms+"ms";
  if(ms<60000)return (ms/1000).toFixed(1)+"s";
  const m=Math.floor(ms/60000);return m+"分"+Math.round((ms%60000)/1000)+"秒";}
function fmtTok(n){
  if(!n)return "0";
  return n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":String(n);}

/* 耗时 / token / 花费:三个都有才排得下,没有的自动省略(如文档提取只有耗时) */
function jobMeta(j){
  const bits=[];
  if(j.duration_ms)bits.push(`<span title="耗时">⏱ ${fmtDur(j.duration_ms)}</span>`);
  if(j.tok_in||j.tok_out)bits.push(
    `<span title="token:输入 ${j.tok_in||0}(含缓存读写) / 输出 ${j.tok_out||0}">`+

/* ---------- HTML → Markdown(所见即所得编辑的回写) ---------- */
function html2md(root){
  const esc2=s=>s.replace(/([*_`])/g,"\\$1");
  function inlineOf(node){
    let out="";
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){out+=n.nodeValue.replace(/\s+/g," ");return;}
      if(n.nodeType!==1)return;
      const t=n.tagName.toLowerCase(),inner=inlineOf(n);
      const st=(n.getAttribute&&n.getAttribute("style"))||"";
      const bold=t==="b"||t==="strong"||/font-weight:\s*(bold|[6-9]00)/.test(st);
      const ital=t==="i"||t==="em"||/font-style:\s*italic/.test(st);
      if(t==="br"){out+="\n";return;}
      if(!inner.trim()&&t!=="br")return;
      if(t==="code"||/monospace/.test(st))out+="`"+inner+"`";
      else if(bold)out+="**"+inner+"**";
      else if(ital)out+="*"+inner+"*";
      else if(t==="a")out+=`[${inner}](${n.getAttribute("href")||""})`;
      else out+=inner;});
    return out;}
  const lines=[];
  function walk(node,depth){
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){const t=n.nodeValue.trim();if(t)lines.push(t,"");return;}
      if(n.nodeType!==1)return;
      const tag=n.tagName.toLowerCase();
      if(/^h[1-6]$/.test(tag)){
        lines.push("#".repeat(+tag[1])+" "+inlineOf(n).trim(),"");}
      else if(tag==="p"||tag==="div"){
        const inner=inlineOf(n).trim();
        if(n.querySelector("table,ul,ol,h1,h2,h3,blockquote,pre"))walk(n,depth);
        else if(inner)lines.push(inner,"");}
      else if(tag==="ul"||tag==="ol"){
        let i=1;
        [...n.children].filter(c=>c.tagName==="LI").forEach(li=>{
          const sub=li.querySelector("ul,ol");
          const own=inlineOf(li).replace(sub?inlineOf(sub):"","").trim();
          const cb=li.querySelector('input[type="checkbox"]');
          const mark=cb?`- [${cb.checked?"x":" "}] `:(tag==="ul"?"- ":`${i++}. `);
          lines.push("  ".repeat(depth)+mark+own);
          if(sub)walk({childNodes:[sub]},depth+1);});
        if(depth===0)lines.push("");}
      else if(tag==="blockquote"){
        inlineOf(n).split("\n").filter(Boolean).forEach(l=>lines.push("> "+l.trim()));
        lines.push("");}
      else if(tag==="pre"){
        lines.push("```",n.textContent.replace(/\n$/,""),"```","");}
      else if(tag==="hr"){lines.push("---","");}
      else if(tag==="table"){
        const rows=[...n.querySelectorAll("tr")];
        if(!rows.length)return;
        const cellsOf=r=>[...r.children].map(c=>inlineOf(c).trim().replace(/\|/g,"\\|")||" ");
        const head=cellsOf(rows[0]);
        lines.push("| "+head.join(" | ")+" |");
        lines.push("|"+head.map(()=>"---").join("|")+"|");
        rows.slice(1).forEach(r=>{const c=cellsOf(r);
          while(c.length<head.length)c.push(" ");
          lines.push("| "+c.slice(0,head.length).join(" | ")+" |");});
        lines.push("");}
      else walk(n,depth);});}
  walk(root,0);
  return lines.join("\n").replace(/\n{3,}/g,"\n\n").trim()+"\n";}

/* 极简 Markdown 渲染 */
function md(src){
  const inline=s=>esc(s)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/\*([^*]+)\*/g,"<i>$1</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines=src.split("\n");let out=[],i=0,list=null,code=false,taskIdx=0;
  const closeList=()=>{if(list){out.push(`</${list}>`);list=null;}};
  while(i<lines.length){let L=lines[i];
    if(code){if(/^```/.test(L)){out.push("</code></pre>");code=false;}else out.push(esc(L)+"\n");i++;continue;}
    if(/^```/.test(L)){closeList();out.push("<pre><code>");code=true;i++;continue;}
    if(/^\s*$/.test(L)){closeList();i++;continue;}
    if(/^---+\s*$/.test(L)){closeList();out.push("<hr>");i++;continue;}
    const h=L.match(/^(#{1,3})\s+(.*)/);
    if(h){closeList();out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);i++;continue;}
    if(/^>\s?/.test(L)){closeList();out.push(`<blockquote>${inline(L.replace(/^>\s?/,""))}</blockquote>`);i++;continue;}
    if(/\|/.test(L)&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){
      closeList();const cells=r=>r.replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
      let t=`<table><tr>${cells(L).map(c=>`<th>${c}</th>`).join("")}</tr>`;i+=2;
      while(i<lines.length&&/\|/.test(lines[i])&&!/^\s*$/.test(lines[i])){
        t+=`<tr>${cells(lines[i]).map(c=>`<td>${c}</td>`).join("")}</tr>`;i++;}
      out.push(t+"</table>");continue;}
    const ul=L.match(/^\s*[-*]\s+(.*)/),ol=L.match(/^\s*\d+[.、]\s+(.*)/);
    if(ul||ol){const want=ul?"ul":"ol";
      if(list!==want){closeList();out.push(`<${want}>`);list=want;}
      const body=(ul||ol)[1];
      const task=body.match(/^\[([ xX])\]\s*(.*)$/);
      if(task){   // 行动项渲染成真复选框,可直接勾选
        const done=task[1].toLowerCase()==="x";
        out.push(`<li class="task${done?" done":""}">`+
          `<input type="checkbox" data-task="${taskIdx}" ${done?"checked":""}`+
          ` onclick="toggleTask(${taskIdx},this.checked,event)">`+
          `<span>${inline(task[2])}</span></li>`);
        taskIdx++;}
      else out.push(`<li>${inline(body)}</li>`);
      i++;continue;}
    closeList();out.push(`<p>${inline(L)}</p>`);i++;}
  closeList();if(code)out.push("</code></pre>");
  return out.join("");}

    vMask().then(x=>{if(location.hash==="#/mask")$("#view").innerHTML=x;});}
  else if(h.startsWith("#/edit/")){
    const np=decodeURIComponent(h.slice(7));
    if(np!==prevPath)EDMODE="preview";  // 换文件才回预览态(同文件重绘保留当前模式)
    edPath=np;html=vEditor();}
  else html=`<div class="empty">页面不存在</div>`;
  $("#view").innerHTML=html;
  paintSide();
  if(edPath)loadEd();
  if(h==="#/ai"){paintChat();startPoll();
    const ta=$("#aiP");if(ta)chatGrow(ta);
    paintBashToggle();}
  if(h==="#/knowledge")paintKbWhitelist();}
window.addEventListener("hashchange",route);
(async()=>{try{await refresh();}catch(e){}
  route();startPoll();})();
</script>
</body>
</html>
